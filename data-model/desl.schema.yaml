version: "1.0.0"
name: "data_engineering_control_model"
description: "Platform-agnostic DESL schema for ingestion orchestration and metadata control."

naming:
  style: "lowercase_snake_case"
  table_name_form: "singular"
  primary_key_pattern: "<table_name>_id"
  foreign_key_pattern: "<referenced_table_name>_id"

entities:
  - name: "data_object"
    description: "Represents an object in the object tree (server, database, schema, table, file, folder, storage container)."
    columns:
      - { name: "data_object_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "object_type", type: "string", nullable: false }
      - { name: "object_name", type: "string", nullable: false }
      - { name: "object_path", type: "string", nullable: false }
      - { name: "parent_data_object_id", type: "bigint", nullable: true }
      - { name: "is_data_object", type: "boolean", nullable: false, default: false }
      - { name: "created_at", type: "timestamp", nullable: false }
    constraints:
      - { type: "unique", columns: ["object_type", "object_path"] }
    relationships:
      - { type: "many_to_one", from: "data_object.parent_data_object_id", to: "data_object.data_object_id" }

  - name: "data_object_schema"
    description: "Defines the schema of a data object (columns and key participation)."
    columns:
      - { name: "data_object_schema_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "data_object_id", type: "bigint", nullable: false }
      - { name: "column_name", type: "string", nullable: false }
      - { name: "data_type", type: "string", nullable: false }
      - { name: "is_nullable", type: "boolean", nullable: false }
      - { name: "is_part_of_primary_key", type: "boolean", nullable: false, default: false }
      - { name: "ordinal_position", type: "int", nullable: false }
    constraints:
      - { type: "unique", columns: ["data_object_id", "column_name"] }
      - { type: "unique", columns: ["data_object_id", "ordinal_position"] }
    relationships:
      - { type: "many_to_one", from: "data_object_schema.data_object_id", to: "data_object.data_object_id" }

  - name: "property"
    description: "Property definition for object-tree-level inheritance."
    columns:
      - { name: "property_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "property_name", type: "string", nullable: false }
      - { name: "data_type", type: "string", nullable: false }
      - { name: "default_value", type: "string", nullable: true }
      - { name: "root_object_type", type: "string", nullable: false }
      - { name: "levels_deep", type: "int", nullable: false }
    constraints:
      - { type: "unique", columns: ["property_name"] }

  - name: "data_object_property"
    description: "Property value assigned to a specific object, optionally inherited."
    columns:
      - { name: "data_object_property_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "data_object_id", type: "bigint", nullable: false }
      - { name: "property_id", type: "bigint", nullable: false }
      - { name: "property_value", type: "string", nullable: true }
      - { name: "inherited_from_data_object_id", type: "bigint", nullable: true }
      - { name: "is_override", type: "boolean", nullable: false, default: false }
    constraints:
      - { type: "unique", columns: ["data_object_id", "property_id"] }
    relationships:
      - { type: "many_to_one", from: "data_object_property.data_object_id", to: "data_object.data_object_id" }
      - { type: "many_to_one", from: "data_object_property.property_id", to: "property.property_id" }
      - { type: "many_to_one", from: "data_object_property.inherited_from_data_object_id", to: "data_object.data_object_id" }

  - name: "data_contract"
    description: "Contract between data owner and consumer for source extraction."
    columns:
      - { name: "data_contract_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "contract_name", type: "string", nullable: false }
      - { name: "source_data_object_id", type: "bigint", nullable: false }
      - { name: "data_owner", type: "string", nullable: false }
      - { name: "data_consumer", type: "string", nullable: false }
      - { name: "allowed_purpose", type: "string", nullable: false }
      - { name: "delivery_window", type: "string", nullable: true }
      - { name: "allowed_frequency", type: "string", nullable: true }
      - { name: "sla_minutes", type: "int", nullable: true }
      - { name: "active_from", type: "timestamp", nullable: false }
      - { name: "active_to", type: "timestamp", nullable: true }
      - { name: "is_active", type: "boolean", nullable: false, default: true }
    constraints:
      - { type: "unique", columns: ["contract_name"] }
    relationships:
      - { type: "many_to_one", from: "data_contract.source_data_object_id", to: "data_object.data_object_id" }

  - name: "task_template"
    description: "Reusable ingestion task definition with retry and idempotency behavior."
    columns:
      - { name: "task_template_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "task_template_name", type: "string", nullable: false }
      - { name: "interface_type", type: "string", nullable: false }
      - { name: "task_code", type: "text", nullable: true }
      - { name: "retry_max_attempts", type: "int", nullable: false, default: 3 }
      - { name: "retry_backoff_seconds", type: "int", nullable: false, default: 30 }
      - { name: "idempotency_key_strategy", type: "string", nullable: false }
      - { name: "target_data_object_id", type: "bigint", nullable: true }
      - { name: "is_active", type: "boolean", nullable: false, default: true }
    constraints:
      - { type: "unique", columns: ["task_template_name"] }
    relationships:
      - { type: "many_to_one", from: "task_template.target_data_object_id", to: "data_object.data_object_id" }

  - name: "event"
    description: "Event stream used by controller for rule evaluation and task creation."
    columns:
      - { name: "event_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "event_timestamp", type: "timestamp", nullable: false }
      - { name: "event_type", type: "string", nullable: false }
      - { name: "event_status", type: "string", nullable: false }
      - { name: "object_type", type: "string", nullable: false }
      - { name: "object_name", type: "string", nullable: false }
      - { name: "object_path", type: "string", nullable: false }
      - { name: "container_type", type: "string", nullable: false }
      - { name: "container_name", type: "string", nullable: false }
      - { name: "increment_identifier", type: "string", nullable: true }
      - { name: "record_count", type: "bigint", nullable: true }
      - { name: "progress_indicator", type: "decimal(5,2)", nullable: true }
      - { name: "source_data_object_id", type: "bigint", nullable: true }
    indexes:
      - { name: "idx_event_timestamp", columns: ["event_timestamp"] }
      - { name: "idx_event_filter", columns: ["event_type", "event_status", "object_type"] }
    relationships:
      - { type: "many_to_one", from: "event.source_data_object_id", to: "data_object.data_object_id" }

  - name: "controller_rule"
    description: "Rule that maps matching events to a task template."
    columns:
      - { name: "controller_rule_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "rule_name", type: "string", nullable: false }
      - { name: "filter_event_type", type: "string", nullable: true }
      - { name: "filter_event_status", type: "string", nullable: true }
      - { name: "filter_object_type", type: "string", nullable: true }
      - { name: "filter_object_name", type: "string", nullable: true }
      - { name: "filter_object_path", type: "string", nullable: true }
      - { name: "filter_container_type", type: "string", nullable: true }
      - { name: "filter_container_name", type: "string", nullable: true }
      - { name: "task_template_id", type: "bigint", nullable: false }
      - { name: "priority", type: "int", nullable: false, default: 100 }
      - { name: "is_active", type: "boolean", nullable: false, default: true }
    constraints:
      - { type: "unique", columns: ["rule_name"] }
    relationships:
      - { type: "many_to_one", from: "controller_rule.task_template_id", to: "task_template.task_template_id" }

  - name: "controller_checkpoint"
    description: "Stores last processed event per controller."
    columns:
      - { name: "controller_checkpoint_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "controller_name", type: "string", nullable: false }
      - { name: "last_processed_event_id", type: "bigint", nullable: false }
      - { name: "updated_at", type: "timestamp", nullable: false }
    constraints:
      - { type: "unique", columns: ["controller_name"] }
    relationships:
      - { type: "many_to_one", from: "controller_checkpoint.last_processed_event_id", to: "event.event_id" }

  - name: "queued_task"
    description: "Task instances created from events (publish-subscriber orchestration)."
    columns:
      - { name: "queued_task_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "source_event_id", type: "bigint", nullable: false }
      - { name: "task_template_id", type: "bigint", nullable: false }
      - { name: "task_status", type: "string", nullable: false }
      - { name: "priority", type: "int", nullable: false, default: 100 }
      - { name: "expected_capacity", type: "int", nullable: false, default: 1 }
      - { name: "late_time_seconds", type: "int", nullable: true }
      - { name: "queued_at", type: "timestamp", nullable: false }
      - { name: "started_at", type: "timestamp", nullable: true }
      - { name: "finished_at", type: "timestamp", nullable: true }
      - { name: "retry_count", type: "int", nullable: false, default: 0 }
      - { name: "error_message", type: "text", nullable: true }
    indexes:
      - { name: "idx_queued_task_pickup", columns: ["task_status", "priority", "queued_at"] }
    relationships:
      - { type: "many_to_one", from: "queued_task.source_event_id", to: "event.event_id" }
      - { type: "many_to_one", from: "queued_task.task_template_id", to: "task_template.task_template_id" }

  - name: "ingestion_batch_log"
    description: "Operational log for each task execution batch."
    columns:
      - { name: "ingestion_batch_log_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "queued_task_id", type: "bigint", nullable: false }
      - { name: "batch_start_at", type: "timestamp", nullable: false }
      - { name: "batch_end_at", type: "timestamp", nullable: true }
      - { name: "completion_status", type: "string", nullable: false }
      - { name: "records_read", type: "bigint", nullable: true }
      - { name: "records_written", type: "bigint", nullable: true }
      - { name: "schema_drift_detected", type: "boolean", nullable: false, default: false }
      - { name: "schema_drift_details", type: "text", nullable: true }
      - { name: "connection_error_details", type: "text", nullable: true }
      - { name: "created_at", type: "timestamp", nullable: false }
    relationships:
      - { type: "many_to_one", from: "ingestion_batch_log.queued_task_id", to: "queued_task.queued_task_id" }

  - name: "ingestion_record_error"
    description: "Record-level errors captured during ingestion execution."
    columns:
      - { name: "ingestion_record_error_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "ingestion_batch_log_id", type: "bigint", nullable: false }
      - { name: "source_record_identifier", type: "string", nullable: true }
      - { name: "error_code", type: "string", nullable: true }
      - { name: "error_message", type: "text", nullable: false }
      - { name: "error_at", type: "timestamp", nullable: false }
    relationships:
      - { type: "many_to_one", from: "ingestion_record_error.ingestion_batch_log_id", to: "ingestion_batch_log.ingestion_batch_log_id" }

  - name: "bitemporal_record"
    description: "Bitemporal pattern using valid interval and recording timestamp."
    columns:
      - { name: "bitemporal_record_id", type: "bigint", nullable: false, primary_key: true }
      - { name: "data_object_id", type: "bigint", nullable: false }
      - { name: "business_key", type: "string", nullable: false }
      - { name: "payload_json", type: "text", nullable: false }
      - { name: "valid_from", type: "timestamp", nullable: false }
      - { name: "valid_to", type: "timestamp", nullable: false }
      - { name: "recorded_at", type: "timestamp", nullable: false }
      - { name: "is_current", type: "boolean", nullable: false, default: true }
    indexes:
      - { name: "idx_bitemporal_lookup", columns: ["data_object_id", "business_key", "valid_from"] }
      - { name: "idx_bitemporal_current", columns: ["data_object_id", "business_key", "is_current"] }
    relationships:
      - { type: "many_to_one", from: "bitemporal_record.data_object_id", to: "data_object.data_object_id" }
    rules:
      - "No overlapping valid intervals for the same business_key within one data_object_id."
      - "When a change is recorded at t, close previous valid_to at t and insert new row with valid_from t."

enums:
  object_type:
    - "server"
    - "database"
    - "schema"
    - "table"
    - "file"
    - "folder"
    - "storage_container"
    - "internal_process"
  event_type:
    - "write"
    - "read"
    - "internal_process"
    - "schema_change"
  event_status:
    - "start"
    - "in_progress"
    - "end_successful"
    - "end_failed"
  task_status:
    - "queued"
    - "running"
    - "completed"
    - "failed"
    - "cancelled"
